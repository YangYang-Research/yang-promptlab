[package]
name = "promptlab-desktop"
description = "PromptLab desktop application (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "promptlab_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "PromptLab"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
promptlab-core = { workspace = true }
promptlab-storage = { workspace = true }
promptlab-report = { workspace = true }
promptlab-endpoint-metadata = { workspace = true }
promptlab-attack = { workspace = true }
promptlab-auth = { workspace = true }
promptlab-harness = { workspace = true }
promptlab-runtime = { workspace = true }
promptlab-inference = { workspace = true }
promptlab-judge = { workspace = true }
promptlab-models = { workspace = true }
promptlab-planner = { workspace = true }
promptlab-generator = { workspace = true }
promptlab-payload = { workspace = true }
promptlab-plugin-host = { workspace = true }
promptlab-target-profile = { workspace = true }
promptlab-agent = { workspace = true }
promptlab-agenttrace = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
url = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
reqwest = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio"] }
