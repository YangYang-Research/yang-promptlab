[package]
name = "aisec-desktop"
description = "AISec desktop application (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "aisec_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "aisec-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aisec-core = { workspace = true }
aisec-storage = { workspace = true }
aisec-report = { workspace = true }
aisec-discovery = { workspace = true }
aisec-attack = { workspace = true }
aisec-auth = { workspace = true }
aisec-judge = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
url = { workspace = true }
tauri = { version = "2", features = [] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio"] }
