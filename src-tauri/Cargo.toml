[package]
name = "aisec-desktop"
description = "AISec desktop application (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "aisec_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "aisec-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aisec-core = { workspace = true }
aisec-storage = { workspace = true }
aisec-report = { workspace = true }
aisec-endpoint-metadata = { workspace = true }
aisec-attack = { workspace = true }
aisec-auth = { workspace = true }
aisec-harness = { workspace = true, features = ["playwright"] }
aisec-runtime = { workspace = true }
aisec-inference = { workspace = true }
aisec-judge = { workspace = true }
aisec-models = { workspace = true }
aisec-planner = { workspace = true }
aisec-generator = { workspace = true }
aisec-plugin-host = { workspace = true }
aisec-target-profile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
url = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
reqwest = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
base64 = "0.22"
which = "7"
tar = "0.4"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio"] }
