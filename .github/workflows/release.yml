name: Release

# One workflow. Stages = jobs:
#   notes → 4× build → Publish update manifest → Upload to R2 CDN
# Fail one platform → Re-run failed jobs (that job only). Manifest + R2 only
# run after all 4 builds succeed. Push code fix → synchronize rebuilds all.
#
# Code signing (optional — unsigned if secrets missing):
#   Windows: WINDOWS_CODESIGN_PASSWORD
#   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
#            APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID

on:
  pull_request:
    types: [labeled, reopened, synchronize]

concurrency:
  group: release-pr-${{ github.event.pull_request.number }}
  # Cancel in-flight only when code changes (new push). Re-run failed jobs is
  # the same run — does not hit this gate.
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-notes:
    name: Generate release notes
    # PR already has `release` → other labels (e.g. ai-review) must not start a 2nd run.
    # Only the moment `release` is applied, or reopen/synchronize with that label, may run.
    if: >
      contains(github.event.pull_request.labels.*.name, 'release') &&
      (github.event.action != 'labeled' || github.event.label.name == 'release')
    runs-on: ubuntu-22.04
    outputs:
      body: ${{ steps.gen.outputs.body }}
      tag: ${{ steps.gen.outputs.tag }}
      title: ${{ steps.gen.outputs.title }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate release notes
        id: gen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          chmod +x scripts/generate-release-notes.sh
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          TAG="v${VERSION}"
          TITLE="PromptLab v${VERSION}"
          scripts/generate-release-notes.sh release-notes.md

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # Refresh notes/title only — do not force --draft (would unpublish a live release).
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --target "$HEAD_SHA" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --draft
          fi

          {
            echo "tag=$TAG"
            echo "title=$TITLE"
            echo "body<<EOF"
            cat release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "----- release notes ($TAG) -----"
          cat release-notes.md

  build-macos-aarch64:
    name: build macOS Apple Silicon
    needs: release-notes
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # Do not put APPLE_* here — empty secret → empty env var → Tauri security import fails.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/release-build
        with:
          args: --target aarch64-apple-darwin
          rust_target: aarch64-apple-darwin
          tag: ${{ needs.release-notes.outputs.tag }}
          release_name: ${{ needs.release-notes.outputs.title }}
          release_body: ${{ needs.release-notes.outputs.body }}
          apple_certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple_certificate_password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple_signing_identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          apple_id: ${{ secrets.APPLE_ID }}
          apple_password: ${{ secrets.APPLE_PASSWORD }}
          apple_team_id: ${{ secrets.APPLE_TEAM_ID }}

  build-macos-x86_64:
    name: build macOS Intel
    needs: release-notes
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/release-build
        with:
          args: --target x86_64-apple-darwin
          rust_target: x86_64-apple-darwin
          tag: ${{ needs.release-notes.outputs.tag }}
          release_name: ${{ needs.release-notes.outputs.title }}
          release_body: ${{ needs.release-notes.outputs.body }}
          apple_certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple_certificate_password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple_signing_identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          apple_id: ${{ secrets.APPLE_ID }}
          apple_password: ${{ secrets.APPLE_PASSWORD }}
          apple_team_id: ${{ secrets.APPLE_TEAM_ID }}

  build-linux:
    name: build Linux
    needs: release-notes
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/release-build
        with:
          rust_target: x86_64-unknown-linux-gnu
          tag: ${{ needs.release-notes.outputs.tag }}
          release_name: ${{ needs.release-notes.outputs.title }}
          release_body: ${{ needs.release-notes.outputs.body }}

  build-windows:
    name: build Windows
    needs: release-notes
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/release-build
        with:
          rust_target: x86_64-pc-windows-msvc
          tag: ${{ needs.release-notes.outputs.tag }}
          release_name: ${{ needs.release-notes.outputs.title }}
          release_body: ${{ needs.release-notes.outputs.body }}

  # Gate: only after all 4 platform builds succeed (no always()).
  publish-manifest:
    name: Publish update manifest
    needs:
      - release-notes
      - build-macos-aarch64
      - build-macos-x86_64
      - build-linux
      - build-windows
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate and upload version.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-notes.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist-assets
          gh release download "$TAG" --repo "$REPO" --dir dist-assets --pattern 'PromptLab-*'
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          NOTES="$(gh release view "$TAG" --repo "$REPO" --json body --jq .body 2>/dev/null | head -c 2000 || true)"
          VERSION="$VERSION" TAG="$TAG" REPO="$REPO" ASSET_DIR=./dist-assets \
            NOTES="${NOTES:-Current release.}" \
            node scripts/generate-update-manifest.mjs

          HASHED="$(node -e "const m=require('./manifests/version.json'); console.log(Object.values(m.platforms).filter(p=>p.sha256).length)")"
          if [[ "$HASHED" -lt 4 ]]; then
            echo "error: expected 4 platform hashes in version.json, got $HASHED" >&2
            node -e "console.log(JSON.stringify(require('./manifests/version.json').platforms,null,2))"
            exit 1
          fi

          gh release upload "$TAG" manifests/version.json --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --draft=false
          echo "Published $TAG ($HASHED platform hash(es)) for auto-update"

  upload-r2:
    name: Upload to R2 CDN
    needs:
      - release-notes
      - publish-manifest
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download release assets + publish to R2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-notes.outputs.tag }}
          REPO: ${{ github.repository }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: yangyang-org-public
        run: |
          set -euo pipefail
          for var in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [[ -z "${!var:-}" ]]; then
              echo "error: secret ${var} is required for R2 upload" >&2
              exit 1
            fi
          done

          mkdir -p dist-assets
          gh release download "$TAG" --repo "$REPO" --dir dist-assets --pattern 'PromptLab-*'
          gh release download "$TAG" --repo "$REPO" --dir dist-assets --pattern 'version.json'
          # Prefer freshly downloaded version.json as the R2 manifest source
          if [[ -f dist-assets/version.json ]]; then
            cp dist-assets/version.json manifests/version.json
          fi

          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          chmod +x scripts/publish-r2-release.sh
          VERSION="$VERSION" TAG="$TAG" ASSET_DIR=./dist-assets \
            MANIFEST=./manifests/version.json \
            scripts/publish-r2-release.sh
