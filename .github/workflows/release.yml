name: Release

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

concurrency:
  group: release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    if: contains(github.event.pull_request.labels.*.name, 'release')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os_name: macOS Apple Silicon
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            macos_deployment_target: "11.0"
          - platform: macos-15-intel
            os_name: macOS Intel
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
            macos_deployment_target: "11.0"
          - platform: ubuntu-22.04
            os_name: Linux
            args: ""
            rust_target: x86_64-unknown-linux-gnu
            macos_deployment_target: ""
          - platform: windows-latest
            os_name: Windows
            args: ""
            rust_target: x86_64-pc-windows-msvc
            macos_deployment_target: ""
    runs-on: ${{ matrix.platform }}
    env:
      # Keep macOS deployment target aligned with Tauri / Apple Silicon CI.
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      - name: Linux Tauri deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            libssl-dev \
            libxdo-dev \
            patchelf \
            libfuse2

      - name: Install JS deps
        run: npm ci

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
          tagName: v__VERSION__-pr.${{ github.event.pull_request.number }}
          releaseName: PromptLab v__VERSION__ (PR #${{ github.event.pull_request.number }})
          releaseBody: |
            Draft from PR #${{ github.event.pull_request.number }} (`${{ github.event.pull_request.head.sha }}`).

            Bundles:
            - macOS Apple Silicon `.dmg` (M1+)
            - macOS Intel `.dmg` (x86_64)
            - Windows x64 `.msi` / `.exe`
            - Linux x64 `.deb` / AppImage

            Review the installers, then publish this release when ready.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
