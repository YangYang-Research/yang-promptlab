name: Release

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

concurrency:
  group: release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    if: contains(github.event.pull_request.labels.*.name, 'release')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os_name: macOS
          - platform: ubuntu-22.04
            os_name: Linux
          - platform: windows-latest
            os_name: Windows
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      - name: Linux Tauri deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            libssl-dev \
            libxdo-dev \
            patchelf \
            libfuse2

      - name: Install JS deps
        run: npm ci

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: v__VERSION__-pr.${{ github.event.pull_request.number }}
          releaseName: PromptLab v__VERSION__ (PR #${{ github.event.pull_request.number }})
          releaseBody: |
            Draft from PR #${{ github.event.pull_request.number }} (`${{ github.event.pull_request.head.sha }}`).

            Bundles: macOS `.dmg`, Windows `.msi` / `.exe`, Linux `.deb` / AppImage.

            Review the installers, then publish this release when ready.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
