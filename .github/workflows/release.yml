name: Release

# One workflow. Stages = jobs. Fail one platform → Actions → Re-run failed jobs
# re-runs only that job (same commit). Push a code fix → synchronize rebuilds
# all platforms at the new SHA.
#
# Code signing (optional — unsigned if secrets missing):
#   Windows: WINDOWS_CODESIGN_PASSWORD
#   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
#            APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID

on:
  pull_request:
    types: [labeled, reopened, synchronize]

concurrency:
  group: release-pr-${{ github.event.pull_request.number }}
  # Cancel in-flight only when code changes (new push). Re-run failed jobs is
  # the same run — does not hit this gate.
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-notes:
    name: Generate release notes
    if: contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-22.04
    outputs:
      body: ${{ steps.gen.outputs.body }}
      tag: ${{ steps.gen.outputs.tag }}
      title: ${{ steps.gen.outputs.title }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate release notes
        id: gen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          chmod +x scripts/generate-release-notes.sh
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          TAG="v${VERSION}"
          TITLE="PromptLab v${VERSION}"
          scripts/generate-release-notes.sh release-notes.md

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --draft
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --target "$HEAD_SHA" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --draft
          fi

          {
            echo "tag=$TAG"
            echo "title=$TITLE"
            echo "body<<EOF"
            cat release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "----- release notes ($TAG) -----"
          cat release-notes.md

  build-macos-aarch64:
    name: build macOS Apple Silicon
    needs: release-notes
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/release-build
        with:
          args: --target aarch64-apple-darwin
          rust_target: aarch64-apple-darwin
          tag: ${{ needs.release-notes.outputs.tag }}
          release_name: ${{ needs.release-notes.outputs.title }}
          release_body: ${{ needs.release-notes.outputs.body }}

  build-macos-x86_64:
    name: build macOS Intel
    needs: release-notes
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/release-build
        with:
          args: --target x86_64-apple-darwin
          rust_target: x86_64-apple-darwin
          tag: ${{ needs.release-notes.outputs.tag }}
          release_name: ${{ needs.release-notes.outputs.title }}
          release_body: ${{ needs.release-notes.outputs.body }}

  build-linux:
    name: build Linux
    needs: release-notes
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/release-build
        with:
          rust_target: x86_64-unknown-linux-gnu
          tag: ${{ needs.release-notes.outputs.tag }}
          release_name: ${{ needs.release-notes.outputs.title }}
          release_body: ${{ needs.release-notes.outputs.body }}

  build-windows:
    name: build Windows
    needs: release-notes
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/release-build
        with:
          rust_target: x86_64-pc-windows-msvc
          tag: ${{ needs.release-notes.outputs.tag }}
          release_name: ${{ needs.release-notes.outputs.title }}
          release_body: ${{ needs.release-notes.outputs.body }}

  update-manifest:
    name: Publish update manifest
    needs:
      - release-notes
      - build-macos-aarch64
      - build-macos-x86_64
      - build-linux
      - build-windows
    if: ${{ always() && !cancelled() && needs.release-notes.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate and upload version.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-notes.outputs.tag }}
          REPO: ${{ github.repository }}
          BUILD_MAC_ARM: ${{ needs.build-macos-aarch64.result }}
          BUILD_MAC_INTEL: ${{ needs.build-macos-x86_64.result }}
          BUILD_LINUX: ${{ needs.build-linux.result }}
          BUILD_WINDOWS: ${{ needs.build-windows.result }}
        run: |
          set -euo pipefail
          mkdir -p dist-assets
          gh release download "$TAG" --repo "$REPO" --dir dist-assets --pattern 'PromptLab-*' || true
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          NOTES="$(gh release view "$TAG" --repo "$REPO" --json body --jq .body 2>/dev/null | head -c 2000 || true)"
          VERSION="$VERSION" TAG="$TAG" REPO="$REPO" ASSET_DIR=./dist-assets \
            NOTES="${NOTES:-Current release.}" \
            node scripts/generate-update-manifest.mjs
          gh release upload "$TAG" manifests/version.json --repo "$REPO" --clobber

          all_ok=true
          for result in "$BUILD_MAC_ARM" "$BUILD_MAC_INTEL" "$BUILD_LINUX" "$BUILD_WINDOWS"; do
            [[ "$result" == "success" ]] || all_ok=false
          done

          HASHED="$(node -e "const m=require('./manifests/version.json'); console.log(Object.values(m.platforms).filter(p=>p.sha256).length)")"
          if [[ "$all_ok" == "true" && "$HASHED" -gt 0 ]]; then
            gh release edit "$TAG" --repo "$REPO" --draft=false
            echo "Published $TAG ($HASHED platform hash(es)) for auto-update"
          else
            echo "Leaving $TAG as draft (hashed=$HASHED mac_arm=$BUILD_MAC_ARM mac_intel=$BUILD_MAC_INTEL linux=$BUILD_LINUX windows=$BUILD_WINDOWS)"
          fi

      - name: Mirror release to yangyang R2 CDN
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: yangyang-org-public
          TAG: ${{ needs.release-notes.outputs.tag }}
          BUILD_MAC_ARM: ${{ needs.build-macos-aarch64.result }}
          BUILD_MAC_INTEL: ${{ needs.build-macos-x86_64.result }}
          BUILD_LINUX: ${{ needs.build-linux.result }}
          BUILD_WINDOWS: ${{ needs.build-windows.result }}
        run: |
          set -euo pipefail
          all_ok=true
          for result in "$BUILD_MAC_ARM" "$BUILD_MAC_INTEL" "$BUILD_LINUX" "$BUILD_WINDOWS"; do
            [[ "$result" == "success" ]] || all_ok=false
          done
          if [[ "$all_ok" != "true" ]]; then
            echo "Skipping R2 mirror (not all platform jobs succeeded)"
            exit 0
          fi
          if [[ -z "${R2_ACCOUNT_ID:-}" || -z "${R2_ACCESS_KEY_ID:-}" || -z "${R2_SECRET_ACCESS_KEY:-}" ]]; then
            echo "Skipping R2 mirror (R2_* secrets not configured)"
            exit 0
          fi
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          chmod +x scripts/publish-r2-release.sh
          VERSION="$VERSION" TAG="$TAG" ASSET_DIR=./dist-assets \
            MANIFEST=./manifests/version.json \
            scripts/publish-r2-release.sh
