[workspace]
resolver = "2"
members = [
    "crates/aisec-core",
    "crates/aisec-attack",
    "crates/aisec-payload",
    "crates/aisec-models",
    "crates/aisec-judge",
    "crates/aisec-report",
    "crates/aisec-fingerprint",
    "crates/aisec-planner",
    "crates/aisec-generator",
    "crates/aisec-agent",
    "crates/aisec-plugin-host",
    "crates/aisec-auth",
    "crates/aisec-discovery",
    "crates/aisec-endpoint-metadata",
    "crates/aisec-target-profile",
    "crates/aisec-harness",
    "crates/aisec-runtime",
    "crates/aisec-inference",
    "crates/aisec-storage",
    "src-tauri",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["PromptLab"]
rust-version = "1.77"

[workspace.dependencies]
aisec-inference = { path = "crates/aisec-inference" }
aisec-attack = { path = "crates/aisec-attack" }
aisec-payload = { path = "crates/aisec-payload" }
aisec-models = { path = "crates/aisec-models" }
aisec-judge = { path = "crates/aisec-judge" }
aisec-report = { path = "crates/aisec-report" }
aisec-fingerprint = { path = "crates/aisec-fingerprint" }
aisec-planner = { path = "crates/aisec-planner" }
aisec-generator = { path = "crates/aisec-generator" }
aisec-agent = { path = "crates/aisec-agent" }
aisec-plugin-host = { path = "crates/aisec-plugin-host" }
aisec-auth = { path = "crates/aisec-auth" }
aisec-harness = { path = "crates/aisec-harness" }
aisec-runtime = { path = "crates/aisec-runtime" }
aisec-core = { path = "crates/aisec-core" }
aisec-discovery = { path = "crates/aisec-discovery" }
aisec-endpoint-metadata = { path = "crates/aisec-endpoint-metadata" }
aisec-target-profile = { path = "crates/aisec-target-profile" }
aisec-storage = { path = "crates/aisec-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "uuid", "time", "json"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "charset"] }
scraper = "0.23"
regex = "1"
url = "2"
dashmap = "6"
keyring = "3.6"
aes-gcm = "0.10"
rand = "0.8"
