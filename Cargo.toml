[workspace]
resolver = "2"
members = [
    "crates/promptlab-core",
    "crates/promptlab-attack",
    "crates/promptlab-payload",
    "crates/promptlab-models",
    "crates/promptlab-judge",
    "crates/promptlab-report",
    "crates/promptlab-fingerprint",
    "crates/promptlab-planner",
    "crates/promptlab-generator",
    "crates/promptlab-plugin-host",
    "crates/promptlab-auth",
    "crates/promptlab-discovery",
    "crates/promptlab-endpoint-metadata",
    "crates/promptlab-agent",
    "crates/promptlab-agenttrace",
    "crates/promptlab-target-profile",
    "crates/promptlab-harness",
    "crates/promptlab-runtime",
    "crates/promptlab-inference",
    "crates/promptlab-storage",
    "src-tauri",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["PromptLab"]
rust-version = "1.77"

[workspace.dependencies]
promptlab-inference = { path = "crates/promptlab-inference" }
promptlab-attack = { path = "crates/promptlab-attack" }
promptlab-payload = { path = "crates/promptlab-payload" }
promptlab-models = { path = "crates/promptlab-models" }
promptlab-judge = { path = "crates/promptlab-judge" }
promptlab-report = { path = "crates/promptlab-report" }
promptlab-fingerprint = { path = "crates/promptlab-fingerprint" }
promptlab-planner = { path = "crates/promptlab-planner" }
promptlab-generator = { path = "crates/promptlab-generator" }
promptlab-plugin-host = { path = "crates/promptlab-plugin-host" }
promptlab-auth = { path = "crates/promptlab-auth" }
promptlab-harness = { path = "crates/promptlab-harness" }
promptlab-runtime = { path = "crates/promptlab-runtime" }
promptlab-core = { path = "crates/promptlab-core" }
promptlab-discovery = { path = "crates/promptlab-discovery" }
promptlab-endpoint-metadata = { path = "crates/promptlab-endpoint-metadata" }
promptlab-agent = { path = "crates/promptlab-agent" }
promptlab-agenttrace = { path = "crates/promptlab-agenttrace" }
promptlab-target-profile = { path = "crates/promptlab-target-profile" }
promptlab-storage = { path = "crates/promptlab-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "uuid", "time", "json"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "local-offset"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "charset", "socks"] }
scraper = "0.23"
regex = "1"
url = "2"
dashmap = "6"
keyring = "3.6"
aes-gcm = "0.10"
rand = "0.8"
