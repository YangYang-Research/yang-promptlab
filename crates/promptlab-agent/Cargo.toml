[package]
name = "promptlab-agent"
description = "Yazg supervisor and sub-agents (AgenticAttackExecution, SequentialAttackExecution, Reflection, AttackPlan, JudgeCoordinator, …)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
promptlab-planner = { workspace = true }
promptlab-target-profile = { workspace = true }
promptlab-judge = { workspace = true }
promptlab-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rig = "0.40.0"
schemars = "1"
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
promptlab-models = { workspace = true }
