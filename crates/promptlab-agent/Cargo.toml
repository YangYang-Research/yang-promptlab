[package]
name = "promptlab-agent"
description = "Yazg supervisor and sub-agents (AgenticAttackExecution, SequentialAttackExecution, Reflection, AttackPlan, JudgeCoordinator, …)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
promptlab-planner = { workspace = true }
promptlab-target-profile = { workspace = true }
promptlab-judge = { workspace = true }
promptlab-core = { workspace = true }
promptlab-agenttrace = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Use rig-core only (not the `rig` facade) so optional companions like
# rig-bedrock / AWS legacy rustls 0.21 stay out of the dependency graph.
rig = { package = "rig-core", version = "0.40.0" }
schemars = "1"
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
promptlab-models = { workspace = true }
