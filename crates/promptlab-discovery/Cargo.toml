[package]
name = "promptlab-discovery"
description = "Attack-surface discovery engine for PromptLab (crawl, API, GraphQL, OpenAPI, AI endpoints)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
promptlab-core = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
# `process` + `io-util` are required for the Playwright subprocess (browser) driver.
tokio = { workspace = true, features = ["process", "io-util"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
wiremock = "0.6"
serde_json = { workspace = true }
