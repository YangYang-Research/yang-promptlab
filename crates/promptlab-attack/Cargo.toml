[package]
name = "promptlab-attack"
description = "PromptLab attack framework — payload execution, mutation, orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
storage = ["dep:promptlab-storage"]

[dependencies]
promptlab-core = { workspace = true }
promptlab-harness = { workspace = true }
promptlab-payload = { workspace = true }
promptlab-storage = { workspace = true, optional = true }
async-trait = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
base64 = "0.22"

[dev-dependencies]
tokio = { workspace = true }
wiremock = "0.6"
