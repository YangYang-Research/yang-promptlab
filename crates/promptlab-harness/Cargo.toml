[package]
name = "promptlab-harness"
description = "Execution harness layer — normalized attack delivery to heterogeneous AI targets"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["http", "openai"]
http = []
openai = []
playwright = ["dep:promptlab-auth"]

[dependencies]
promptlab-core = { workspace = true }
promptlab-auth = { workspace = true, optional = true }
async-trait = { workspace = true }
base64 = "0.22"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "io-util", "sync", "time", "process"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
