[package]
name = "aisec-runtime"
description = "Embedded local AI runtime supervisor and model provider for AISec"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
aisec-core = { workspace = true }
aisec-models = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "fs", "time", "macros", "rt-multi-thread"] }
reqwest = { workspace = true }
tracing = { workspace = true }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
