[package]
name = "promptlab-judge"
description = "PromptLab AI Judge Engine — rule, regex, LLM evaluation with multi-model consensus"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
# Enable the in-process llama.cpp runtime so the LLM evaluator runs real models.
llama = ["promptlab-models/llama"]

[[example]]
name = "judge_with_local_model"
required-features = ["llama"]

[dependencies]
promptlab-core = { workspace = true }
promptlab-harness = { workspace = true }
promptlab-models = { workspace = true }
promptlab-runtime = { workspace = true }
promptlab-inference = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
hmac = "0.12"
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
