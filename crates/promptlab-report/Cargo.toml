[package]
name = "promptlab-report"
description = "PromptLab reporting engine — HTML, PDF, JSON, SARIF, CSV export"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
promptlab-core = { workspace = true }
async-trait = { workspace = true }
printpdf = { version = "0.7", default-features = false, features = ["embedded_images"] }
lopdf = "0.31"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
promptlab-storage = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
