[package]
name = "aisec-judge"
description = "AISec AI Judge Engine — rule, regex, LLM evaluation with multi-model consensus"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
# Enable the in-process llama.cpp runtime so the LLM evaluator runs real models.
llama = ["aisec-models/llama"]

[[example]]
name = "judge_with_local_model"
required-features = ["llama"]

[dependencies]
aisec-core = { workspace = true }
aisec-harness = { workspace = true }
aisec-models = { workspace = true }
aisec-runtime = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
hmac = "0.12"
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
