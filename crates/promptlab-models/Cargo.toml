[package]
name = "promptlab-models"
description = "PromptLab model registry — remote/third-party providers and vault metadata"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
storage = ["dep:promptlab-storage"]

[dependencies]
promptlab-core = { workspace = true }
promptlab-storage = { workspace = true, optional = true }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "process", "sync"] }
tracing = { workspace = true }
uuid = { workspace = true }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
sysctl = "0.6"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
