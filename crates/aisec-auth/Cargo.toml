[package]
name = "aisec-auth"
description = "Authentication engine for AISec (Playwright login recording, session replay, token extraction)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
aisec-core = { workspace = true }
aisec-storage = { workspace = true }
async-trait = { workspace = true }
base64 = "0.22"
jsonwebtoken = "9"
keyring = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
sha2 = "0.10"
reqwest = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
# `process` (spawn Node Playwright runner), `io-util` (async stdin/stdout pipes),
# and `fs` (storageState vault files) are required by this crate.
tokio = { workspace = true, features = ["process", "io-util", "fs"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["process", "io-util", "fs"] }
