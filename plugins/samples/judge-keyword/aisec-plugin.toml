[plugin]
id = "com.aisec.sample.judge-keyword"
name = "Keyword Judge"
version = "1.0.0"
api_version = "1"
plugin_type = "judge"
language = "python"
description = "Rule-based keyword judge plugin"
author = "AISec"

[runtime]
type = "subprocess"
entry = "plugin.py"
interpreter = "python3"

[capabilities]
log = true

[hooks]
evaluate = "evaluate"
