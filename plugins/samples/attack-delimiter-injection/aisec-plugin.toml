[plugin]
id = "com.aisec.sample.attack-delimiter"
name = "Delimiter Injection Pack"
version = "1.0.0"
api_version = "1"
plugin_type = "attack"
language = "javascript"
description = "Generates delimiter-based prompt injection payloads"
author = "AISec"

[runtime]
type = "subprocess"
entry = "plugin.js"
interpreter = "node"
min_aisec = "0.1.0"

[capabilities]
probe_mutate = true
log = true

[hooks]
execute_attack = "execute_attack"

[permissions.rationale]
probe_mutate = "Mutate attack payloads before execution"
